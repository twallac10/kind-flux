apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: base
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  wait: true
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  path: ./clusters/kind/base
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  wait: true
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: false
  path: ./clusters/kind/config
  dependsOn:
    - name: base
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  path: ./clusters/kind/tenants
  dependsOn:
    - name: base
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./app
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: config
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  path: ./clusters/kind/notifications
  dependsOn:
    - name: base
      namespace: flux-system
