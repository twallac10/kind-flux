apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: policy
spec:
  interval: 5m0s
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: policy
spec:
  serviceAccountName: helm-controller
  interval: 1m0s
  timeout: 2m
  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  releaseName: kyverno
  targetNamespace: policy
  values: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: policy
spec:
  serviceAccountName: helm-controller
  interval: 1m0s
  timeout: 2m
  chart:
    spec:
      chart: kyverno-policies
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  releaseName: kyverno-policies
  targetNamespace: policy
  values: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-controller
  namespace: policy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-controller-policy
subjects:
  - kind: ServiceAccount
    name: helm-controller
    namespace: policy
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io